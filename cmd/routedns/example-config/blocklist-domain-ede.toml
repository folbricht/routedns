# Domain blocklist that attaches an EDNS0 Extended DNS Error to blocked
# responses, telling the client why it was blocked. The text is a template
# populated with data from the query and the rule that matched.

[resolvers.cloudflare-dot]
address = "1.1.1.1:853"
protocol = "dot"

[groups.cloudflare-blocklist]
type             = "blocklist-v2"
resolvers        = ["cloudflare-dot"] # Anything that passes the filter is sent on to this resolver
blocklist-format = "domain"           # "domain", "hosts" or "regexp", defaults to "regexp"
edns0-ede = {code = 15, text = "Blocked {{ .Question }} with ID {{ .ID }} because rule {{ .BlocklistRule }} on {{ .Blocklist}}"} # Extended error code
blocklist        = [                  # Define the names to be blocked
  'evil.com',
  '.facebook.com',
  '*.twitter.com',
]

[listeners.local-udp]
address = ":53"
protocol = "udp"
resolver = "cloudflare-blocklist"
