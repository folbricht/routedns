# Simple proxy using a cache.

[resolvers.cloudflare-dot]
address = "1.1.1.1:853"
protocol = "dot"

[groups.cloudflare-cached]
type = "cache"
resolvers = ["cloudflare-dot"]
cache-negative-ttl = 10         # Optional, TTL to apply to responses without a SOA
cache-answer-shuffle = "round-robin" # Optional, rotate the order of cached responses
# The cache is persisted to disk. Under the systemd unit shipped with the packages
# this has to be a path below /var/cache/routedns, see doc/overview.md#writable-paths.
backend = {type = "memory", size = 1000, filename = "/var/cache/routedns/cache.json", save-interval = 60}

[listeners.local-udp]
address = "127.0.0.1:53"
protocol = "udp"
resolver = "cloudflare-cached"
