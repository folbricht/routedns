# Strips any EDNS Client Subnet option from queries before they go upstream, so
# the client's network is not passed on.

[resolvers.google-dot]
address = "8.8.8.8:853"
protocol = "dot"

[groups.google-ecs]
type = "ecs-modifier"
resolvers = ["google-dot"]
ecs-op = "delete" # "add", "delete", "privacy". Defaults to "" which does nothing.

[listeners.local-udp]
address = ":53"
protocol = "udp"
resolver = "google-ecs"

[listeners.local-tcp]
address = ":53"
protocol = "tcp"
resolver = "google-ecs"
