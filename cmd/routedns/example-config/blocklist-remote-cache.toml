# Config with a remote blocklist that is refreshed once a day and caches the list
# for faster start up. After the list has been downloaded, it is stored on disk and
# used during the next startup. The local cache is refreshed every time the list
# is loaded.
[resolvers.cloudflare-dot]
address = "1.1.1.1:853"
protocol = "dot"

[groups.cloudflare-blocklist]
type = "blocklist-v2"
resolvers = ["cloudflare-dot"]
blocklist-refresh = 86400
# Under the systemd unit shipped with the packages, cache-dir has to be a path
# below /var/cache/routedns, see doc/configuration.md#writable-paths.
blocklist-source = [
   {format = "domain", source = "https://raw.githubusercontent.com/cbuijs/accomplist/main/malicious-dom/routedns.blocklist.domain.list", cache-dir = "/var/cache/routedns"},
   {format = "domain", source = "https://raw.githubusercontent.com/cbuijs/accomplist/main/easylist/routedns.blocklist.domain.list", cache-dir = "/var/cache/routedns"},
]

[listeners.local-udp]
address = ":53"
protocol = "udp"
resolver = "cloudflare-blocklist"
