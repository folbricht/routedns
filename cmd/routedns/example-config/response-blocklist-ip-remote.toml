# Response IP blocklist with the CIDR lists downloaded over HTTP and refreshed
# once a day.

[resolvers.cloudflare-dot]
address = "1.1.1.1:853"
protocol = "dot"

[groups.cloudflare-blocklist]
type              = "response-blocklist-ip"
resolvers         = ["cloudflare-dot"]
blocklist-refresh = 86400
blocklist-source  = [
  {format = "cidr", source = "https://raw.githubusercontent.com/cbuijs/accomplist/main/malicious-ip/plain.black.ip4cidr.list"},
  {format = "cidr", source = "https://raw.githubusercontent.com/cbuijs/accomplist/main/malicious-ip/plain.black.ip6cidr.list"},
]

[listeners.local-udp]
address = ":53"
protocol = "udp"
resolver = "cloudflare-blocklist"

[listeners.local-tcp]
address = ":53"
protocol = "tcp"
resolver = "cloudflare-blocklist"
